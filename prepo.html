<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial & Directions Master 🐝📦🏙️</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #10b981;
      --danger: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --highlight: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .header-title { font-size: 1rem; color: var(--accent); font-weight: bold; }
    .header-controls { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      background: #334155;
      border: none;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    nav {
      display: flex;
      gap: 4px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 10px;
    }

    .nav-btn {
      flex: 1;
      padding: 8px 2px;
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    main {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #334155;
    }

    .game-mode { display: none; }
    .game-mode.active { display: block; }

    /* TARGET PHRASE DISPLAY */
    .phrase-banner {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }

    .phrase-text {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .highlight-prep {
      color: var(--highlight);
      text-decoration: underline;
      font-weight: 800;
      padding: 0 2px;
    }

    /* CSS 3D STAGE FOR MODE 1 */
    .stage-3d-wrapper {
      perspective: 800px;
      height: 180px;
      background: #090d16;
      border-radius: 12px;
      position: relative;
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cube-3d {
      width: 60px;
      height: 60px;
      position: absolute;
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(30deg);
      transition: transform 0.5s ease;
    }

    .face {
      position: absolute;
      width: 60px;
      height: 60px;
      background: rgba(59, 130, 246, 0.75);
      border: 2px solid #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .front  { transform: translateZ(30px); }
    .back   { transform: rotateY(180deg) translateZ(30px); }
    .top    { transform: rotateX(90deg) translateZ(30px); background: rgba(96, 165, 250, 0.85); }
    .bottom { transform: rotateX(-90deg) translateZ(30px); }
    .left   { transform: rotateY(-90deg) translateZ(30px); }
    .right  { transform: rotateY(90deg) translateZ(30px); }

    .bee-3d {
      position: absolute;
      font-size: 2.2rem;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* 6 OPTIONS GRID */
    .options-grid-6 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-secondary { background: #334155; }
    .btn-success { background: var(--secondary); }
    .btn-warning { background: var(--accent); color: #000; }

    /* MODE 2 STAGE */
    .mode2-stage {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scene-card-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .scene-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: border 0.2s ease;
    }

    .scene-card.selected { border-color: var(--primary); }

    /* GRID MAP FOR MODE 3 */
    .grid-map {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 4px;
      aspect-ratio: 1;
      background: #0f172a;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 10px;
    }

    .grid-cell {
      background: #1e293b;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      position: relative;
      border: 1px solid #334155;
    }

    .grid-cell.user-visited { background: rgba(79, 70, 229, 0.35); border-color: var(--primary); }
    .grid-cell.correct-path { background: rgba(16, 185, 129, 0.3); border-color: var(--secondary); }
    .grid-cell.error-node { background: rgba(239, 68, 68, 0.4); border-color: var(--danger); }

    .player-orient {
      transition: transform 0.2s ease;
      display: inline-block;
      position: relative;
    }

    /* Flashlight orientation cone */
    .flashlight-cone {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 16px solid rgba(245, 158, 11, 0.5);
      pointer-events: none;
    }

    .cell-label {
      font-size: 0.5rem;
      color: var(--text-muted);
      margin-top: 1px;
      text-align: center;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      max-width: 180px;
      margin: 8px auto;
    }

    .feedback-msg {
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      min-height: 24px;
      margin-top: 6px;
    }
    .feedback-msg.correct { color: var(--secondary); }
    .feedback-msg.wrong { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <div class="header-title">English Spatial & Directions 🏙️</div>
    <div class="header-controls">
      <span>Score: <strong id="score-val">0</strong></span>
      <button class="icon-btn" id="audio-toggle-btn" onclick="toggleGlobalAudio()">🔊 Audio</button>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchMode(1)">1. 3D Spatial (Bee) 🐝</button>
    <button class="nav-btn" onclick="switchMode(2)">2. Scene Context 🧩</button>
    <button class="nav-btn" onclick="switchMode(3)">3. Map Directions 🧭</button>
  </nav>

  <main>
    <!-- MODE 1: 3D BEE & PREPOSITIONS -->
    <section id="mode-1" class="game-mode active">
      <div class="phrase-banner">
        <div id="m1-phrase" class="phrase-text">Select the correct preposition...</div>
        <button class="icon-btn" id="m1-speak-btn" style="display:none;" onclick="speakCurrentM1Phrase()">🔊 Listen</button>
      </div>

      <div class="stage-3d-wrapper">
        <div class="cube-3d" id="cube3d">
          <div class="face front">📦</div>
          <div class="face back">📦</div>
          <div class="face top">📦</div>
          <div class="face bottom">📦</div>
          <div class="face left">📦</div>
          <div class="face right">📦</div>
        </div>
        <div id="bee3d" class="bee-3d">🐝</div>
      </div>

      <div id="m1-options" class="options-grid-6"></div>
      <div id="m1-feedback" class="feedback-msg"></div>
    </section>

    <!-- MODE 2: SCENE CONTEXT & RELATIVE POSITIONS -->
    <section id="mode-2" class="game-mode">
      <div class="phrase-banner">
        <div id="m2-prompt" class="phrase-text">Loading scene challenge...</div>
        <button class="icon-btn" onclick="speakText(document.getElementById('m2-prompt').innerText)">🔊</button>
      </div>

      <div class="mode2-stage">
        <div id="m2-cards" class="scene-card-container"></div>
      </div>
      <div id="m2-feedback" class="feedback-msg"></div>
    </section>

    <!-- MODE 3: PROCEDURAL DIRECTIONS & PATH TRACING -->
    <section id="mode-3" class="game-mode">
      <div class="phrase-banner">
        <div id="m3-transcript" class="phrase-text" style="font-size:0.8rem;">Tap 'Listen' to start route!</div>
        <button class="icon-btn" onclick="playAudioInstruction()">🔊 Listen</button>
      </div>

      <div id="m3-grid" class="grid-map"></div>

      <div class="dpad">
        <div></div>
        <button class="btn btn-secondary" onclick="moveM3Player('FORWARD')">⬆️ Forward</button>
        <div></div>
        <button class="btn btn-secondary" onclick="turnM3Player('LEFT')">↺ Turn Left</button>
        <button class="btn btn-secondary" onclick="moveM3Player('BACK')">⬇️ Back</button>
        <button class="btn btn-secondary" onclick="turnM3Player('RIGHT')">↻ Turn Right</button>
      </div>

      <div style="display:flex; gap:6px; margin-top:8px;">
        <button class="btn btn-warning" onclick="resetM3Route()">🔄 Reset</button>
        <button class="btn btn-success" onclick="verifyM3Arrival()">🎯 Check Route</button>
      </div>
      <button class="btn btn-secondary" id="reveal-path-btn" style="display:none; margin-top:6px;" onclick="revealCorrectM3Path()">🗺️ Show Correct Path</button>
      <div id="m3-feedback" class="feedback-msg"></div>
    </section>
  </main>

  <script>
    // Audio State & Synth
    let globalAudioEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, duration = 0.1) {
      if (!globalAudioEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSound(isCorrect) {
      if (isCorrect) {
        playBeep(523.25, 0.1);
        setTimeout(() => playBeep(659.25, 0.15), 100);
      } else {
        playBeep(200, 0.25);
      }
    }

    function speakText(text) {
      if (!globalAudioEnabled) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g, ''));
        msg.lang = 'en-US';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
      }
    }

    function toggleGlobalAudio() {
      globalAudioEnabled = !globalAudioEnabled;
      const btn = document.getElementById('audio-toggle-btn');
      btn.innerText = globalAudioEnabled ? '🔊 Audio' : '🔇 Muted';
      if (!globalAudioEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    let score = 0;
    function updateScore(delta) {
      score += delta;
      document.getElementById('score-val').innerText = score;
      playSound(delta > 0);
    }

    function switchMode(modeNum) {
      document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === modeNum - 1));
      document.querySelectorAll('.game-mode').forEach((m, i) => m.classList.toggle('active', i === modeNum - 1));
      if (modeNum === 1) initMode1();
      if (modeNum === 2) initMode2();
      if (modeNum === 3) initMode3();
    }

    /* ===================================================
       MODE 1: EXPANDED PREPOSITIONS & CSS 3D
    =================================================== */
    const prepositions3D = [
      { key: 'ABOVE', synonyms: ['above', 'over'], transform: 'translate3d(0px, -75px, 0px)' },
      { key: 'UNDER', synonyms: ['under', 'below', 'beneath'], transform: 'translate3d(0px, 75px, 0px)' },
      { key: 'NEXT_TO', synonyms: ['next to', 'beside', 'by'], transform: 'translate3d(75px, 0px, 0px)' },
      { key: 'INSIDE', synonyms: ['in', 'inside'], transform: 'translate3d(0px, 0px, 0px) scale(0.7)' },
      { key: 'BEHIND', synonyms: ['behind'], transform: 'translate3d(0px, -15px, -80px)' },
      { key: 'IN_FRONT_OF', synonyms: ['in front of'], transform: 'translate3d(0px, 15px, 80px)' },
      { key: 'ON_TOP_OF', synonyms: ['on', 'on top of'], transform: 'translate3d(0px, -42px, 0px)' },
      { key: 'FAR_FROM', synonyms: ['far from'], transform: 'translate3d(120px, -50px, 0px)' },
      { key: 'NEAR', synonyms: ['near', 'close to'], transform: 'translate3d(50px, -20px, 0px)' }
    ];

    let currentM1Group = null;
    let currentM1Synonym = '';
    let currentM1FullSentence = '';

    function initMode1() {
      const optionsContainer = document.getElementById('m1-options');
      optionsContainer.innerHTML = '';
      document.getElementById('m1-feedback').innerText = '';
      document.getElementById('m1-speak-btn').style.display = 'none';

      currentM1Group = prepositions3D[Math.floor(Math.random() * prepositions3D.length)];
      currentM1Synonym = currentM1Group.synonyms[Math.floor(Math.random() * currentM1Group.synonyms.length)];

      const bee = document.getElementById('bee3d');
      bee.style.transform = currentM1Group.transform;

      document.getElementById('m1-phrase').innerHTML = 'Where is the bee relative to the box?';

      // Pick 6 unique options
      let options = [currentM1Synonym];
      while (options.length < 6) {
        const randG = prepositions3D[Math.floor(Math.random() * prepositions3D.length)];
        const randSyn = randG.synonyms[Math.floor(Math.random() * randG.synonyms.length)];
        if (!options.includes(randSyn)) options.push(randSyn);
      }

      options.sort(() => 0.5 - Math.random());
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-secondary';
        btn.innerText = opt.toUpperCase();
        btn.onclick = () => checkMode1(opt);
        optionsContainer.appendChild(btn);
      });
    }

    function checkMode1(selected) {
      const fb = document.getElementById('m1-feedback');
      if (currentM1Group.synonyms.includes(selected)) {
        fb.className = 'feedback-msg correct';
        fb.innerText = 'Excelente!';
        
        currentM1FullSentence = `The bee is <span class="highlight-prep">${selected}</span> the box.`;
        document.getElementById('m1-phrase').innerHTML = currentM1FullSentence;
        document.getElementById('m1-speak-btn').style.display = 'inline-flex';
        
        speakText(`The bee is ${selected} the box.`);
        updateScore(10);
        setTimeout(initMode1, 2500);
      } else {
        fb.className = 'feedback-msg wrong';
        fb.innerText = `Incorrect. '${selected}' does not match the bee's position.`;
        updateScore(-5);
      }
    }

    function speakCurrentM1Phrase() {
      speakText(document.getElementById('m1-phrase').innerText);
    }

    /* ===================================================
       MODE 2: SCENE CONTEXT & EXPLANATORY FEEDBACK
    =================================================== */
    const mode2Questions = [
      {
        prompt: "Which picture shows the cat <span class='highlight-prep'>UNDER</span> the table?",
        prep: "under",
        cards: [
          { icon: "🐱\n🪵", label: "Cat under table", correct: true, exp: "Correct! The cat is beneath the table surface." },
          { icon: "🐱🪵", label: "Cat on table", correct: false, exp: "Incorrect! Here the cat is ON TOP OF the table." }
        ]
      },
      {
        prompt: "Select the image where the dog is <span class='highlight-prep'>BEHIND</span> the door.",
        prep: "behind",
        cards: [
          { icon: "🚪🐕", label: "Dog behind door", correct: true, exp: "Correct! The door blocks the view of the dog." },
          { icon: "🐕🚪", label: "Dog in front of door", correct: false, exp: "Incorrect! The dog is IN FRONT OF the door." }
        ]
      },
      {
        prompt: "Where is the apple <span class='highlight-prep'>BETWEEN</span> two boxes?",
        prep: "between",
        cards: [
          { icon: "📦🍎📦", label: "Apple between boxes", correct: true, exp: "Correct! The apple has a box on both sides." },
          { icon: "🍎📦📦", label: "Apple next to boxes", correct: false, exp: "Incorrect! The apple is NEXT TO the boxes." }
        ]
      }
    ];

    function initMode2() {
      const container = document.getElementById('m2-cards');
      container.innerHTML = '';
      document.getElementById('m2-feedback').innerText = '';

      const q = mode2Questions[Math.floor(Math.random() * mode2Questions.length)];
      document.getElementById('m2-prompt').innerHTML = q.prompt;
      speakText(q.prompt);

      q.cards.sort(() => 0.5 - Math.random());
      q.cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'scene-card';
        div.innerHTML = `<div style="font-size:2.5rem; white-space:pre-line; text-align:center;">${card.icon}</div>`;
        div.onclick = () => {
          const fb = document.getElementById('m2-feedback');
          if (card.correct) {
            fb.className = 'feedback-msg correct';
            fb.innerText = card.exp;
            updateScore(10);
            setTimeout(initMode2, 2200);
          } else {
            fb.className = 'feedback-msg wrong';
            fb.innerText = card.exp; // Detailed error explanation!
            updateScore(-5);
          }
        };
        container.appendChild(div);
      });
    }

    /* ===================================================
       MODE 3: PROCEDURAL DIRECTIONS, ORIENTATION & PATH REVEAL
    =================================================== */
    const allLandmarks = [
      { icon: '🏥', name: 'Hospital' }, { icon: '☕', name: 'Cafe' },
      { icon: '🏫', name: 'School' }, { icon: '🌳', name: 'Park' },
      { icon: '🍕', name: 'Pizzeria' }, { icon: '💊', name: 'Pharmacy' },
      { icon: '🥐', name: 'Bakery' }, { icon: '📚', name: 'Library' }
    ];

    let m3GridLandmarks = {};
    let m3ExpectedPath = [];
    let m3UserHistory = [];
    let m3UserOrient = 0; // 0: North (Up), 90: East (Right), 180: South (Down), 270: West (Left)
    let m3InstructionText = '';

    function initMode3() {
      document.getElementById('reveal-path-btn').style.display = 'none';
      document.getElementById('m3-feedback').innerText = '';

      // Randomize landmark positions on 5x5 grid
      m3GridLandmarks = { '0,0': { icon: '🏠', name: 'Start' } };
      let availableKeys = [];
      for (let x = 0; x < 5; x++) {
        for (let y = 0; y < 5; y++) {
          if (x !== 0 || y !== 0) availableKeys.push(`${x},${y}`);
        }
      }
      availableKeys.sort(() => 0.5 - Math.random());

      allLandmarks.forEach((lm, idx) => {
        if (availableKeys[idx]) m3GridLandmarks[availableKeys[idx]] = lm;
      });

      // Procedural Route Generation
      let current = { x: 0, y: 0 };
      m3ExpectedPath = [{ ...current }];
      let phrases = ["Start at Home facing North."];
      const connectors = ["Then,", "After that,", "Next,"];

      let currentOrient = 0; // facing North
      const legs = 2;

      for (let i = 0; i < legs; i++) {
        // Choose turn: left (-90) or right (+90)
        const turnRight = Math.random() > 0.5;
        const turnAngle = turnRight ? 90 : -90;
        currentOrient = (currentOrient + turnAngle + 360) % 360;

        const turnText = turnRight ? "turn right" : "turn left";
        const blocks = 1 + Math.floor(Math.random() * 2);

        // Calculate step vector based on current orientation
        let dx = 0, dy = 0;
        if (currentOrient === 0) dy = -1;
        if (currentOrient === 90) dx = 1;
        if (currentOrient === 180) dy = 1;
        if (currentOrient === 270) dx = -1;

        // Check bounds
        let validSteps = 0;
        for (let b = 1; b <= blocks; b++) {
          const nx = current.x + dx * b;
          const ny = current.y + dy * b;
          if (nx >= 0 && nx < 5 && ny >= 0 && ny < 5) validSteps++;
          else break;
        }

        if (validSteps > 0) {
          const conn = i > 0 ? connectors[Math.floor(Math.random() * connectors.length)] : "";
          phrases.push(`${conn} ${turnText} and walk ${validSteps} block${validSteps > 1 ? 's' : ''} forward.`.trim());

          for (let s = 0; s < validSteps; s++) {
            current.x += dx;
            current.y += dy;
            m3ExpectedPath.push({ ...current });
          }
        }
      }

      const destKey = `${current.x},${current.y}`;
      if (m3GridLandmarks[destKey]) {
        phrases.push(`You should arrive at the ${m3GridLandmarks[destKey].name}.`);
      }

      m3InstructionText = phrases.join(" ");
      m3UserHistory = [{ x: 0, y: 0 }];
      m3UserOrient = 0;

      document.getElementById('m3-transcript').innerText = 'Click 🔊 Listen to hear your directions!';
      renderM3Grid();
    }

    function renderM3Grid(highlightCorrectPath = false, errorIndex = -1) {
      const container = document.getElementById('m3-grid');
      container.innerHTML = '';
      const userCurrent = m3UserHistory[m3UserHistory.length - 1];

      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 5; x++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          const key = `${x},${y}`;

          const isVisited = m3UserHistory.some(p => p.x === x && p.y === y);
          if (isVisited) cell.classList.add('user-visited');

          if (highlightCorrectPath && m3ExpectedPath.some(p => p.x === x && p.y === y)) {
            cell.classList.add('correct-path');
          }

          if (errorIndex !== -1 && m3UserHistory[errorIndex] && m3UserHistory[errorIndex].x === x && m3UserHistory[errorIndex].y === y) {
            cell.classList.add('error-node');
          }

          if (x === userCurrent.x && y === userCurrent.y) {
            cell.innerHTML = `
              <div class="player-orient" style="transform: rotate(${m3UserOrient}deg);">
                <div class="flashlight-cone"></div>
                🧍
              </div>`;
          } else if (m3GridLandmarks[key]) {
            cell.innerText = m3GridLandmarks[key].icon;
          }

          if (m3GridLandmarks[key]) {
            const label = document.createElement('span');
            label.className = 'cell-label';
            label.innerText = m3GridLandmarks[key].name;
            cell.appendChild(label);
          }

          container.appendChild(cell);
        }
      }
    }

    function playAudioInstruction() {
      document.getElementById('m3-transcript').innerText = `"${m3InstructionText}"`;
      speakText(m3InstructionText);
    }

    function turnM3Player(dir) {
      m3UserOrient = (m3UserOrient + (dir === 'RIGHT' ? 90 : -90) + 360) % 360;
      renderM3Grid();
    }

    function moveM3Player(type) {
      const last = m3UserHistory[m3UserHistory.length - 1];
      let dx = 0, dy = 0;
      if (m3UserOrient === 0) dy = -1;
      if (m3UserOrient === 90) dx = 1;
      if (m3UserOrient === 180) dy = 1;
      if (m3UserOrient === 270) dx = -1;

      if (type === 'BACK') { dx = -dx; dy = -dy; }

      const newX = Math.max(0, Math.min(4, last.x + dx));
      const newY = Math.max(0, Math.min(4, last.y + dy));

      if (newX !== last.x || newY !== last.y) {
        m3UserHistory.push({ x: newX, y: newY });
        renderM3Grid();
      }
    }

    function resetM3Route() {
      m3UserHistory = [{ x: 0, y: 0 }];
      m3UserOrient = 0;
      document.getElementById('reveal-path-btn').style.display = 'none';
      document.getElementById('m3-feedback').innerText = '';
      renderM3Grid();
    }

    function verifyM3Arrival() {
      const fb = document.getElementById('m3-feedback');
      let firstErrorIdx = -1;

      for (let i = 0; i < m3UserHistory.length; i++) {
        if (!m3ExpectedPath[i] || m3UserHistory[i].x !== m3ExpectedPath[i].x || m3UserHistory[i].y !== m3ExpectedPath[i].y) {
          firstErrorIdx = i;
          break;
        }
      }

      if (firstErrorIdx === -1 && m3UserHistory.length === m3ExpectedPath.length) {
        fb.className = 'feedback-msg correct';
        fb.innerText = 'Perfect route execution!';
        updateScore(25);
        setTimeout(initMode3, 2200);
      } else {
        fb.className = 'feedback-msg wrong';
        if (firstErrorIdx !== -1) {
          fb.innerText = `Route error at step ${firstErrorIdx + 1}! You deviated from the spoken instructions.`;
        } else {
          fb.innerText = `Incomplete route! You stopped before reaching the target.`;
        }
        document.getElementById('reveal-path-btn').style.display = 'inline-block';
        renderM3Grid(false, firstErrorIdx);
        updateScore(-5);
      }
    }

    function revealCorrectM3Path() {
      renderM3Grid(true);
      document.getElementById('m3-feedback').innerText = 'Green cells show the correct expected path!';
    }

    // Init App
    initMode1();
  </script>
</body>
</html>
