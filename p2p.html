<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P LangApp MVP</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --primary: #00ff88; --text: #ffffff; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .view { display: none; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input { width: 90%; padding: 12px; margin-bottom: 10px; background: #2a2a2a; border: none; color: white; border-radius: 6px; }
    button { background: var(--primary); color: #000; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.2s; }
    button:hover { opacity: 0.8; }
    
    .room-card { display: block; background: #2a2a2a; margin-bottom: 10px; text-align: left; border: 1px solid #444; }
    #peers-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .peer-card { background: #333; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid var(--primary); }
    #audio-tags { display: none; } /* Ocultamos las etiquetas de audio */
  </style>
</head>
<body>

  <!-- VISTA 1: INICIO DE SESIÓN -->
  <div id="login-view" class="view" style="display: block;">
    <div class="card">
      <h2>Crea tu Perfil (Local)</h2>
      <input type="text" id="username" placeholder="Tu Nombre">
      <input type="text" id="nativeLang" placeholder="Idioma Nativo (Ej: ES)">
      <input type="text" id="learningLang" placeholder="Aprendiendo (Ej: EN)">
      <button onclick="App.login()">Entrar</button>
    </div>
  </div>

  <!-- VISTA 2: LISTA DE SALAS -->
  <div id="rooms-view" class="view">
    <div class="card">
      <h2>Salas de Práctica</h2>
      <button onclick="App.createRoom()">+ Crear Nueva Sala</button>
      <hr style="border-color: #333; margin: 20px 0;">
      <button onclick="App.loadRooms()" style="background: #444; color: white; margin-bottom: 15px;">🔄 Actualizar Lista</button>
      <div id="rooms-list">
        <!-- Las salas aparecerán aquí -->
      </div>
    </div>
  </div>

  <!-- VISTA 3: SALA ACTIVA -->
  <div id="active-room-view" class="view">
    <div class="card">
      <h2 id="room-title">Sala</h2>
      <button onclick="location.reload()" style="background: #ff4444;">🚪 Salir de la Sala</button>
      <div id="peers-container">
        <!-- Las tarjetas de los usuarios conectados aparecerán aquí -->
      </div>
    </div>
  </div>

  <!-- Contenedor invisible para los elementos de audio HTML5 -->
  <div id="audio-tags"></div>

  <!-- IMPORTACIÓN DE SCRIPTS -->
  <script src="webrtc.js"></script>
  <script src="app.js"></script>
</body>
</html>
