<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P LangApp MVP</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --primary: #00ff88; --text: #c9d1d9; --border: #30363d; }
    body { font-family: -apple-system, BlinkMacSystemFont, monospace; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 80px; }
    .view { display: none; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 10px; background: #0d1117; border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-bottom: 10px; }
    button { background: #238636; color: #fff; font-weight: bold; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 5px; }
    button:hover { opacity: 0.9; }
    
    .room-btn { background: #1f6beb; margin-bottom: 8px; text-align: left; }
    #peers-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
    .peer-card { background: #0d1117; padding: 10px; border-radius: 6px; border: 1px solid var(--border); text-align: center; border-left: 3px solid var(--primary); }
    
    /* CHAT P2P */
    #chat-box { height: 160px; background: #0d1117; border: 1px solid var(--border); overflow-y: auto; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
    .chat-msg { margin-bottom: 8px; word-break: break-word; }
    .chat-img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
    #status-banner { background: #21262d; color: #f0f6fc; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; display: none; }

    /* NAVEGACIÓN INFERIOR */
    #bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000;
    }
    .nav-btn { background: none; border: none; color: #8b949e; font-size: 13px; cursor: pointer; width: auto; margin: 0; }
    .nav-btn.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <div id="status-banner"></div>

  <!-- VISTA 1: LOGIN -->
  <div id="login-view" class="view" style="display: block;">
    <div class="card">
      <h3>Configura tu Perfil</h3>
      <input type="text" id="username" placeholder="Tu Nombre o Nick">
      <input type="text" id="nativeLang" placeholder="Idioma Nativo (ej: Español)">
      <input type="text" id="learningLang" placeholder="Aprendiendo (ej: Inglés)">
      <button onclick="App.login()">Entrar a la App</button>
    </div>
  </div>

  <!-- VISTA 2: SALAS -->
  <div id="rooms-view" class="view">
    <div class="card">
      <h3>Salas de Práctica</h3>
      <button onclick="App.createRoom()">+ Crear Nueva Sala</button>
      <button onclick="App.loadRooms()" style="background: #30363d; margin-top: 8px;">Refrescar Lista</button>
      <hr style="border-color: var(--border); margin: 15px 0;">
      <div id="rooms-list">Cargando salas...</div>
    </div>
  </div>

  <!-- VISTA 3: SALA ACTIVA (AUDIO + CHAT P2P) -->
  <div id="active-room-view" class="view">
    <div class="card">
      <h3 id="room-title">Sala Activa</h3>
      <div id="peers-container"></div>
      
      <!-- CHAT Y ARCHIVOS P2P -->
      <h4>Chat Grupal P2P</h4>
      <div id="chat-box"></div>
      
      <div style="display: flex; gap: 5px; margin-bottom: 8px;">
        <input type="text" id="msgInput" placeholder="Escribe un mensaje..." style="margin:0;">
        <button onclick="App.sendChatText()" style="width: 80px; margin:0;">Enviar</button>
      </div>
      
      <div style="display: flex; gap: 5px; align-items: center;">
        <input type="file" id="fileInput" style="font-size: 11px;">
        <button onclick="App.sendChatFile()" style="background: #1f6beb; width: 120px; margin:0;">Enviar Archivo</button>
      </div>

      <button onclick="App.leaveRoom()" style="background: #da3633; margin-top: 15px;">Salir de la Sala</button>
    </div>
  </div>

  <!-- VISTA 4: MINIJUEGOS -->
  <div id="games-view" class="view">
    <div class="card" style="padding: 10px;">
      <h3>Minijuegos de Inglés 🎮</h3>
      <div style="display: flex; gap: 5px; margin-bottom: 10px;">
        <button onclick="document.getElementById('game-frame').src='prepo.html'" style="padding: 6px; font-size: 12px;">Preposiciones 🐝</button>
        <button onclick="document.getElementById('game-frame').src='c1.html'" style="padding: 6px; font-size: 12px;">Nivel C1 🧠</button>
        <button onclick="document.getElementById('game-frame').src='mytext.html'" style="padding: 6px; font-size: 12px;">Lectura 📚</button>
      </div>
      <iframe id="game-frame" src="prepo.html" style="width:100%; height:460px; border:none; border-radius:6px; background: #0f172a;"></iframe>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <nav id="bottom-nav" style="display: none;">
    <button class="nav-btn active" onclick="App.switchTab('rooms-view', this)">🏠 Salas</button>
    <button class="nav-btn" onclick="App.switchTab('games-view', this)">🎮 Minijuegos</button>
  </nav>

  <div id="audio-tags"></div>

  <script src="webrtc.js"></script>
  <script src="app.js"></script>
</body>
</html>
